<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Индикатор диктовки</title>
  <style>
    :root {
      --voice-level: 0;
      --primary: 56, 189, 248;
      --accent: 14, 165, 233;
      --glow: 125, 211, 252;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    .voice-blob {
      width: 72px;
      height: 72px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 18px rgba(var(--glow), 0.48));
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(var(--primary), 0.6);
      transform: scale(calc(1 + var(--voice-level) * 0.5));
      opacity: calc(0.22 + var(--voice-level) * 0.45);
      transition: transform 90ms linear, opacity 90ms linear;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .ring-2 {
      inset: 3px;
      border-color: rgba(var(--accent), 0.7);
      animation-duration: 1.1s;
      animation-direction: reverse;
    }

    .core {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 30%,
        rgba(var(--glow), 0.92) 0%,
        rgba(var(--primary), 0.82) 35%,
        rgba(var(--accent), 0.72) 100%
      );
      display: flex;
      justify-content: center;
      align-items: center;
      transform: scale(calc(0.94 + var(--voice-level) * 0.28));
      transition: transform 70ms linear;
      box-shadow: 0 0 20px rgba(var(--accent), 0.55);
    }

    .bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 42px;
      gap: 4px;
      padding-bottom: 2px;
    }

    .bar {
      width: 5px;
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(
        to top,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(225, 247, 255, 0.96) 100%
      );
      opacity: 0.35;
      transition: height 70ms linear, opacity 70ms linear;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
    }

    @keyframes pulse {
      0% {
        transform: scale(calc(1 + var(--voice-level) * 0.38));
      }
      50% {
        transform: scale(calc(1.05 + var(--voice-level) * 0.5));
      }
      100% {
        transform: scale(calc(1 + var(--voice-level) * 0.38));
      }
    }
  </style>
</head>
<body>
  <div class="voice-blob" id="voiceBlob">
    <span class="ring ring-1"></span>
    <span class="ring ring-2"></span>
    <div class="core">
      <div class="bars">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const bars = Array.from(document.querySelectorAll(".bar"));
      let targetLevel = 0;
      let currentLevel = 0;

      const clamp = (value) => Math.max(0, Math.min(1, value));

      window.updateVoiceLevel = (value) => {
        const parsed = Number(value);
        targetLevel = Number.isFinite(parsed) ? clamp(parsed) : 0;
      };

      const animate = () => {
        currentLevel += (targetLevel - currentLevel) * 0.28;
        document.documentElement.style.setProperty(
          "--voice-level",
          currentLevel.toFixed(4)
        );

        const t = performance.now() * 0.02;
        bars.forEach((bar, index) => {
          const waveA = Math.sin(t + index * 0.9);
          const waveB = Math.sin(t * 0.63 + index * 1.3);
          const wobble = (waveA + waveB) * 4.2;
          const baseHeight = 8 + currentLevel * 30 + index * 0.9 + wobble;
          const height = Math.max(8, Math.min(42, baseHeight));
          bar.style.height = `${height.toFixed(1)}px`;
          bar.style.opacity = (0.3 + currentLevel * 0.7).toFixed(3);
        });

        requestAnimationFrame(animate);
      };

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
